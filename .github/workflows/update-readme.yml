name: Update README

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - run: pip install pyyaml
      
      - name: Generate README from .skill files
        run: |
          python3 << 'EOF'
          import os
          import re
          import yaml
          import zipfile
          import glob
          
          skills = []
          
          # Find all .skill files
          skill_files = glob.glob('**/*.skill', recursive=True)
          print(f"Found {len(skill_files)} .skill files")
          
          for skill_file in sorted(skill_files):
              print(f"\nProcessing: {skill_file}")
              try:
                  # .skill files are zip archives
                  with zipfile.ZipFile(skill_file, 'r') as zip_ref:
                      # Find SKILL.md inside
                      for file_info in zip_ref.filelist:
                          if file_info.filename.endswith('SKILL.md'):
                              content = zip_ref.read(file_info.filename).decode('utf-8')
                              
                              # Extract frontmatter
                              match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
                              if match:
                                  try:
                                      data = yaml.safe_load(match.group(1))
                                      skills.append(data)
                                      print(f"  ✓ Found skill: {data.get('name')}")
                                  except Exception as e:
                                      print(f"  ✗ YAML error: {e}")
                              break
              except Exception as e:
                  print(f"  ✗ Error reading {skill_file}: {e}")
          
          # Generate README
          readme = """# Claude Skills Repository
          
          A collection of custom Claude skills for productivity, content creation, faith documentation, and technical education.
          
          ## 📚 Skills Directory
          
          """
          
          if skills:
              for i, skill in enumerate(skills, 1):
                  name = skill.get('name', 'Unknown')
                  desc = skill.get('description', 'No description')
                  readme += f"### {i}. **{name}**\n\n{desc}\n\n---\n\n"
          else:
              readme += "No skills found.\n\n"
          
          readme += """## 🚀 How to Use
          
          1. Download a `.skill` file
          2. Install in Claude.ai settings
          3. Use the trigger phrases
          
          ---
          
          Built with Claude AI | Maintained by Jon Taylor
          """
          
          with open('README.md', 'w') as f:
              f.write(readme)
          
          print(f"\n✅ README updated with {len(skills)} skills!")
          EOF
      
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "docs: auto-update README" && git push)
