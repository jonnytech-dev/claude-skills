# GitHub Actions workflow to auto-generate README from skill files
# Place this file in: .github/workflows/update-readme.yml

name: Update README from Skills

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**/*.md'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      - name: Generate README
        run: python generate-readme.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-generate README from skills" && git push)
